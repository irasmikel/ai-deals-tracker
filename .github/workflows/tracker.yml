name: AI Deals Monitor

on:
  schedule:
    - cron: '0 */2 * * *'  # Ejecución automática cada 2 horas en punto
  workflow_dispatch:        # Permite ejecutarlo manualmente desde GitHub

jobs:
  check-deals:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Permite actualizar sent_links.txt en el repo
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar rastreador
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tracker.py

      - name: Guardar histórico de enlaces vistos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_links.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "update history [skip ci]" && git push)
